name: CI

on:
  workflow_dispatch:

  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    # test are broken for now
    # - name: Run tests
    #   run: npm test

    - name: Build
      run: npm run build

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
        retention-days: 7

  publish:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@${{ github.repository_owner }}'

      - name: Install dependencies
        run: npm ci --production=false

      - name: Get current version from repository variable
        id: get_version
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          # Get current version from GitHub repository variable
          CURRENT_VERSION="${{ vars.CURRENT_VERSION || '0.0.1' }}"
          echo "Current version from repository variable: $CURRENT_VERSION"

          # Parse version components
          IFS='.' read -r major minor patch <<< "$CURRENT_VERSION"
          echo "Current components: $major.$minor.$patch"

          # Increment patch version
          NEW_PATCH=$((patch + 1))
          NEW_VERSION="$major.$minor.$NEW_PATCH"
          echo "New version: $NEW_VERSION"

          # Set outputs for next steps
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
        shell: bash

      - name: Update package.json version
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          # Update package.json with new version without creating a commit
          npm --no-git-tag-version version ${{ steps.get_version.outputs.new_version }}
          echo "Updated package.json to version ${{ steps.get_version.outputs.new_version }}"

      - name: Update repository variable with GitHub CLI
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          echo "Updating CURRENT_VERSION repository variable to: ${{ steps.get_version.outputs.new_version }}"
          echo "${{ secrets.ACCESS_TOKEN }}" | gh auth login --with-token
          gh variable set CURRENT_VERSION -b "${{ steps.get_version.outputs.new_version }}" --repo ${{ github.repository }}

      # - name: Publish to GitHub Packages
