name: CI/CD

# Release flow (CURRENT_VERSION repository variable holds the last stable version):
#   push to `stage` -> publish `X.Y.Z-rc.N` to GitHub Packages (dist-tag `next`), tag the commit `vX.Y.Z-rc.N`
#   push to `main`  -> publish `X.Y.Z` from the latest rc tag reachable from main to npm (dist-tag `latest`),
#                      tag the commit `vX.Y.Z` and set CURRENT_VERSION to `X.Y.Z`
# Merge stage into main with a merge commit (not squash) so the rc tag stays in main's history.

on:
  workflow_dispatch:

  push:
    branches: [ main, stage ]
    paths:
      - '.github/workflows/ci-cd.yaml'
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

  pull_request:
    branches: [ main, stage ]

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      target: ${{ steps.version.outputs.target }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Setup pnpm
      uses: pnpm/action-setup@v5

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 26.x
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Lint
      run: pnpm run lint

    - name: Run tests
      run: pnpm test

    - name: Build
      run: pnpm run build

    - name: Resolve release version
      id: version
      if: github.event_name != 'pull_request'
      shell: bash
      run: |
        if [ "${{ github.ref }}" = "refs/heads/stage" ]; then
          # Next patch after the last stable release, with an incrementing rc number
          CURRENT_VERSION="${{ vars.CURRENT_VERSION || '0.0.0' }}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
          NEXT="$MAJOR.$MINOR.$((PATCH + 1))"
          LAST_RC=$(git tag -l "v$NEXT-rc.*" | sed 's/.*-rc\.//' | sort -n | tail -1)
          VERSION="$NEXT-rc.$(( ${LAST_RC:-0} + 1 ))"
          echo "Staging version: $VERSION (last stable: $CURRENT_VERSION)"
          echo "target=github" >> $GITHUB_OUTPUT
        elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
          # Release the latest rc merged into main as a stable version
          TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*-rc.*' 2>/dev/null || true)
          if [ -z "$TAG" ]; then
            echo "::notice::No staged rc tag found in main's history, skipping npm publish"
            exit 0
          fi
          VERSION="${TAG#v}"
          VERSION="${VERSION%-rc.*}"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::notice::$VERSION (from $TAG) is already released, skipping npm publish"
            exit 0
          fi
          echo "Releasing $TAG as $VERSION"
          echo "target=npm" >> $GITHUB_OUTPUT
        else
          exit 0
        fi

        pnpm version --no-git-tag-version "$VERSION"
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Create package tarball
      if: steps.version.outputs.version != ''
      run: |
        # Pack the package into a tarball (will run prepare script if needed)
        pnpm pack
        echo "Package contents:"
        tar -tvf *.tgz
        # Move the tarball to a fixed name for easier reference
        mv *.tgz package.tgz

    - name: Upload artifacts
      if: steps.version.outputs.version != ''
      uses: actions/upload-artifact@v7
      with:
        name: package-artifacts
        path: |
          package.tgz
        retention-days: 7

  publish-github:
    needs: build-and-test
    if: needs.build-and-test.outputs.target == 'github'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@${{ github.repository_owner }}'

      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          name: package-artifacts

      - name: Publish to GitHub Packages
        run: npm publish package.tgz --access private --tag next --registry https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag staged release
        run: gh api repos/${{ github.repository }}/git/refs -f ref="refs/tags/v${{ needs.build-and-test.outputs.version }}" -f sha="${{ github.sha }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    needs: build-and-test
    if: needs.build-and-test.outputs.target == 'npm'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          name: package-artifacts

      - name: Publish to npm
        shell: bash
        run: |
          NAME=$(tar -xOzf package.tgz package/package.json | node -p "JSON.parse(require('fs').readFileSync(0)).name")
          VERSION="${{ needs.build-and-test.outputs.version }}"
          if npm view "$NAME@$VERSION" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "::notice::$NAME@$VERSION is already on npm, skipping"
            exit 0
          fi
          npm publish package.tgz --access public --tag latest --registry https://registry.npmjs.org

      - name: Tag release
        run: gh api repos/${{ github.repository }}/git/refs -f ref="refs/tags/v${{ needs.build-and-test.outputs.version }}" -f sha="${{ github.sha }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update repository variable with GitHub CLI
        run: gh variable set CURRENT_VERSION -b "${{ needs.build-and-test.outputs.version }}" --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
