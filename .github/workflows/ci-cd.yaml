name: CI/CD

on:
  workflow_dispatch:

  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 26.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Run tests
      run: npm test

    - name: Build
      run: npm run build

    - name: Update package version
      id: update_version
      if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      run: |
        # Get current version from GitHub repository variable
        CURRENT_VERSION="${{ vars.CURRENT_VERSION || '0.0.1' }}"
        echo "Current version from repository variable: $CURRENT_VERSION"

        # Increment the patch version directly from CURRENT_VERSION
        MAJOR=$(echo $CURRENT_VERSION | cut -d. -f1)
        MINOR=$(echo $CURRENT_VERSION | cut -d. -f2)
        PATCH=$(echo $CURRENT_VERSION | cut -d. -f3)
        PATCH=$((PATCH + 1))
        NEW_VERSION="$MAJOR.$MINOR.$PATCH"
        echo "New version (incremented patch): $NEW_VERSION"

        # Update package.json version to match
        npm --no-git-tag-version version $NEW_VERSION

        # Set outputs for next steps
        echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
        echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
      shell: bash

    - name: Update repository variable with GitHub CLI
      if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      run: |
        echo "Updating CURRENT_VERSION repository variable to: ${{ steps.update_version.outputs.new_version }}"
        echo "${{ secrets.ACCESS_TOKEN }}" | gh auth login --with-token
        gh variable set CURRENT_VERSION -b "${{ steps.update_version.outputs.new_version }}" --repo ${{ github.repository }}

    - name: Create npm package
      run: |
        # Pack the package into a tarball (will run prepare script if needed)
        npm pack
        echo "Package tarball created successfully"
        # List the contents of the tarball for verification
        echo "Package contents:"
        tar -tvf *.tgz
        # Move the tarball to a fixed name for easier reference
        mv *.tgz package.tgz

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: package-artifacts
        path: |
          package.tgz
        retention-days: 7

  publish:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@${{ github.repository_owner }}'

      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          name: package-artifacts

      - name: Publish to GitHub Packages
        run: |
          # Publish the downloaded package
          npm publish package.tgz --access private
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
