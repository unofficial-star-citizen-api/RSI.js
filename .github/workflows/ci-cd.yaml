name: CI

on:
  workflow_dispatch:

  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    # test are broken for now
    # - name: Run tests
    #   run: npm test

    - name: Build
      run: npm run build

    - name: Create npm package
      run: |
        # Pack the package into a tarball (will run prepare script if needed)
        npm pack
        echo "Package tarball created successfully"
        # List the contents of the tarball for verification
        echo "Package contents:"
        tar -tvf *.tgz
        # Move the tarball to a fixed name for easier reference
        mv *.tgz package.tgz

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: package-artifacts
        path: |
          dist/
          package.tgz
        retention-days: 7

  publish:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@${{ github.repository_owner }}'

      - name: Install dependencies
        run: npm ci --production=false

      - name: Update package version
        id: update_version
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          # Get current version from GitHub repository variable
          CURRENT_VERSION="${{ vars.CURRENT_VERSION || '0.0.1' }}"
          echo "Current version from repository variable: $CURRENT_VERSION"

          # Use npm version to increment the patch version
          NEW_VERSION=$(npm --no-git-tag-version version patch)
          NEW_VERSION=$(echo $NEW_VERSION | sed 's/v//')
          echo "New version (incremented by npm): $NEW_VERSION"

          # Set outputs for next steps
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
        shell: bash

      - name: Update repository variable with GitHub CLI
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          echo "Updating CURRENT_VERSION repository variable to: ${{ steps.update_version.outputs.new_version }}"
          echo "${{ secrets.ACCESS_TOKEN }}" | gh auth login --with-token
          gh variable set CURRENT_VERSION -b "${{ steps.update_version.outputs.new_version }}" --repo ${{ github.repository }}

      - name: Download package artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/download-artifact@v4
        with:
          name: package-artifacts

      - name: Update package.json version
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          # Update package.json with the new version
          npm version ${{ steps.update_version.outputs.new_version }} --no-git-tag-version
          echo "Updated package.json to version ${{ steps.update_version.outputs.new_version }}"

      - name: Publish to GitHub Packages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          # Publish the downloaded package
          npm publish package.tgz --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
